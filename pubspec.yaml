name: lora_blok
description: "Aplikacija za bilježenje rezultata kartaške igre lora"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/lora_blok_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/lora_blok_icon.png"
  adaptive_icon_background: "#98BB6C"
  adaptive_icon_foreground: "assets/images/lora_blok_icon.png"
  min_sdk_android: 21
